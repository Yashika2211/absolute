[project]
name = "streamline"
version = "0.1.0"
description = "Real-time recommendation system with a streaming feature store"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15.0",
    "torch>=2.3",
    "mlflow>=2.16",
    "confluent-kafka>=2.4",
    "bytewax>=0.21.1",
    "duckdb>=1.5.6",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "kaggle>=1.6",
    "fakeredis[lua]>=2.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamline"]

# CPU-only torch wheels on Linux (CI) to keep installs small.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs docker services from `make up` (run with -m integration)",
]
